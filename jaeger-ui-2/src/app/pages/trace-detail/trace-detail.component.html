<div class="flex flex-col h-full p-4 gap-4">

  <!-- Breadcrumb -->
  <div class="flex items-center gap-2 text-sm text-slate-400">
    <a routerLink="/search" class="hover:text-primary transition-colors cursor-pointer">Search</a>
    <span class="pi pi-chevron-right text-xs"></span>
    <span class="text-white font-mono text-xs truncate max-w-xs">{{ traceId }}</span>
  </div>

  <!-- Loading indicator -->
  @if (loading()) {
    <div class="flex justify-center py-10">
      <p-progressSpinner strokeWidth="3" styleClass="w-12 h-12" />
    </div>
  }

  <!-- Error -->
  @if (error()) {
    <div class="p-3 rounded-lg bg-red-900/30 border border-red-500/30 text-red-300 text-sm">
      <i class="pi pi-exclamation-triangle mr-2"></i>{{ error() }}
    </div>
  }

  @if (!loading() && trace()) {
    <!-- Mode tabs -->
    <div class="flex items-center gap-2">
      <p-button
        label="Timeline"
        [outlined]="mode() !== 'timeline'"
        size="small"
        (onClick)="setMode('timeline')"
        icon="pi pi-bars"
      />
      <p-button
        label="Service Graph"
        [outlined]="mode() !== 'dag'"
        size="small"
        (onClick)="setMode('dag')"
        icon="pi pi-share-alt"
      />
    </div>

    <!-- React Graph -->
    <div
      class="flex-1 bg-surface-900/80 border border-white/10 rounded-xl overflow-hidden"
      style="min-height: 480px"
    >
      <app-trace-viewer
        [traceId]="traceId"
        [trace]="trace()"
        [dependencies]="dependencies()"
        [mode]="mode()"
        class="block w-full h-full"
      />
    </div>

    <!-- EventBus span selection display -->
    @if (selectedSpan()) {
      <div class="bg-surface-800/60 border border-primary/30 rounded-lg p-3 text-xs text-slate-300">
        <span class="text-primary font-medium">EventBus ›</span>
        span selected from React:
        <code class="ml-1 text-white">{{ selectedSpan()?.operationName }}</code>
        <span class="ml-1 text-slate-500">— {{ selectedSpan()?.serviceName }} — {{ formatDuration(selectedSpan()!.duration) }}</span>
      </div>
    }
  }

</div>
