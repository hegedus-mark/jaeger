service:
  extensions: [jaeger_storage, jaeger_query]
  pipelines:
    traces:
      receivers: [otlp]
      processors: []
      exporters: [jaeger_storage_exporter]

extensions:
  jaeger_query:
    storage:
      traces: es_storage
  jaeger_storage:
    backends:
      es_storage:
        elasticsearch:
          server_urls: ["http://elasticsearch:9200"]

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  jaeger_storage_exporter:
    trace_storage: es_storage
